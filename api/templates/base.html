<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Aplikasi{% endblock %}</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #f1f5f9; color: #0f172a; }
    .card { background: #fff; border-radius: 12px; padding: 28px; box-shadow: 0 4px 16px rgba(0,0,0,.06); }
    input { width: 100%; padding: 10px 12px; margin: 6px 0 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; }
    button, .btn { display: inline-block; padding: 10px 16px; border: 0; border-radius: 8px; background: #2563eb; color: #fff; font-size: 15px; cursor: pointer; text-decoration: none; }
    button { width: 100%; }
    .alert { padding: 10px 12px; border-radius: 8px; margin-bottom: 14px; font-size: 14px; }
    .alert-danger { background: #fee2e2; color: #991b1b; }
    .alert-warning { background: #fef3c7; color: #92400e; }
    .alert-success { background: #dcfce7; color: #166534; }
    label { font-size: 14px; font-weight: 600; }
  </style>
</head>
<body>
  {% block body %}{% endblock %}
</body>
</html>
